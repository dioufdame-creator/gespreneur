<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gespreneur</title>
<meta name="description" content="Gestion simple pour petit commerce : ventes, achats, stock, clients, fournisseurs et relances WhatsApp.">
<meta name="theme-color" content="#f4f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gespreneur">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: application téléphone à une colonne. En-tête fixe en haut, barre d'onglets fixe en bas, formulaires dans des panneaux qui montent du bas. Noir/blanc + un seul vert sobre ; le rouge ne sert qu'aux dettes. */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --fg:#151917; --muted:#5b6560; --line:#dce1de;
  --accent:#1e5a43; --accent-fg:#ffffff; --accent-soft:#e5eee9;
  --debt:#b0271f; --debt-soft:#faeceb; --scrim:rgba(10,14,12,.45);
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1311; --surface:#171c19; --fg:#eef1ef; --muted:#9ba5a0; --line:#2a312d;
  --accent:#6dbb93; --accent-fg:#0b100d; --accent-soft:#1d2b24;
  --debt:#f2867b; --debt-soft:#33201e; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1311; --surface:#171c19; --fg:#eef1ef; --muted:#9ba5a0; --line:#2a312d;
  --accent:#6dbb93; --accent-fg:#0b100d; --accent-soft:#1d2b24;
  --debt:#f2867b; --debt-soft:#33201e; --scrim:rgba(0,0,0,.6); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:24px;height:24px;flex:none}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 180px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:40px;height:40px;border-radius:11px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.04em;flex:none}
.bname{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);flex:none}

h1{font-size:27px;line-height:1.15;margin:6px 0 16px;text-wrap:balance}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:30px 0 10px;font-weight:700}
h3{font-size:22px;margin:4px 48px 14px 0}
h4{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:15px}
.small{font-size:13px}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.debt{color:var(--debt)}
.err{color:var(--debt);font-weight:700;margin:0}
.note{font-size:15px;color:var(--muted);margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--bg)}
.empty{color:var(--muted);padding:18px 16px;margin:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.list{overflow:hidden}
.list>.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kpi{font-size:24px;margin-top:2px}
.linkish{display:block;width:100%}
.pill{display:inline-block;font-size:13px;line-height:1.2;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.debt{background:var(--debt-soft);color:var(--debt)}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;width:68px;flex:none;color:var(--muted)}
.tag.vente{color:var(--accent)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:14px;border:1px dashed var(--line);border-radius:var(--r);font-size:15px;color:var(--muted)}
.banner button{color:var(--fg);font-weight:700;text-decoration:underline;white-space:nowrap}
.banner.install{border-style:solid;background:var(--surface);color:var(--fg);flex-wrap:wrap}
.bactions{display:flex;gap:16px}
.banner.install .bactions button:first-child{text-decoration:none;background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:10px}
.banner.install .bactions button:last-child{color:var(--muted)}

.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.big{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:112px;padding:16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-size:21px;font-weight:700}
.big .ic{width:32px;height:32px}
.big.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--debt)}
.btn.small{min-height:44px;width:auto;padding:0 14px;font-size:15px}
.stack{display:flex;flex-direction:column;gap:14px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:700;min-height:44px;margin-left:-6px}

.search{position:relative;margin:0 0 14px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.search input{padding-left:44px}
input,textarea{font:inherit;font-size:18px;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.sheet input,.sheet textarea{background:var(--bg)}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;min-width:0}
.field input{font-weight:400}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:48px;padding:0 6px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);font-weight:700;font-size:15px;text-align:center}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:15px}

.pick{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;width:100%;padding:12px 16px;margin-bottom:14px}
.pick .sub{grid-column:1}
.pick .title{grid-column:1;font-size:19px}
.pick .ic{grid-column:2;grid-row:1 / span 2;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{position:relative;display:flex;flex-direction:column;gap:4px;padding:8px 8px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);min-width:0}
.item.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.item:disabled{opacity:.45;cursor:not-allowed}
.item .iname{font-weight:700;font-size:16px;line-height:1.25;margin-top:4px;padding:0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .amt,.item .sub,.item .pill{margin:0 4px}
.item .pill{align-self:flex-start;margin-top:2px}
.thumb{aspect-ratio:1/1;width:100%;max-width:100%;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:28px;overflow:hidden;letter-spacing:.02em}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:46px;height:46px;font-size:16px;border-radius:9px;flex:none}
.thumb.lg{width:84px;height:84px;font-size:24px;flex:none}
.qty-badge{position:absolute;top:4px;right:4px;min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

.avatar{width:44px;height:44px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.avatar.lg{width:60px;height:60px;font-size:20px}
.head{display:flex;gap:14px;align-items:center;margin:6px 0 16px}
.head h1{margin:0}
.balance{padding:18px 16px;display:flex;flex-direction:column;gap:4px}
.balance.is-debt{background:var(--debt-soft);border-color:transparent}
.balance.is-debt .bigamt{color:var(--debt)}
.bigamt{font-size:34px;line-height:1.1}
.seltext{user-select:all}

.cartbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.cartbar .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar .amt{font-size:24px}
.cartbar .btn{width:auto;min-width:150px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;justify-content:center;font-size:12.5px;color:var(--muted);font-weight:700;border-radius:10px;text-align:center}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .ic{stroke-width:2.4}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet .inner{max-width:560px;margin:0 auto;position:relative}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.close{position:absolute;top:8px;right:-4px;width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1;display:grid;place-items:center;color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.lines{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-bottom:12px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .main{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);font-size:24px;font-weight:700;display:grid;place-items:center;text-align:center}
.stepper span{min-width:28px;text-align:center;font-size:19px}
.total-line{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 16px;font-weight:700}
.sums{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.sums>div{display:flex;justify-content:space-between;font-size:17px}
.sums>div:last-child{font-size:20px;padding-top:8px;border-top:1px solid var(--line)}
.restebox{padding:14px 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.restebox.is-debt{background:var(--debt-soft);color:var(--debt)}
.restebox .sub{color:inherit;font-weight:400;opacity:.85;margin-top:2px}

.photo-pick{display:flex;align-items:center;gap:14px;cursor:pointer}
.photo-pick .thumb .ic{width:30px;height:30px}
.switchrow{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.switch{width:58px;height:34px;border-radius:17px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch span{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{left:27px}

.perseg button{font-size:14px;padding:0 4px;line-height:1.15}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.pnav b{font-size:18px;text-align:center;flex:1;min-width:0}
.pnav button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav-t{font-weight:700;font-size:16px;margin:0 0 12px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kcard{padding:14px;min-width:0}
.kcard .amt{display:block;font-size:20px;margin-top:4px}
.kmain{padding:18px 16px}
.kmain .amt{display:block;font-size:34px;line-height:1.1;margin:4px 0 6px}
.pill.down{background:var(--debt-soft);color:var(--debt)}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:12px}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;cursor:pointer}
.chart .bar{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.chart .bar.zero{background:var(--line)}
.xlabels{display:flex;gap:3px;margin-top:6px}
.xlabels span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:visible}
.meter{height:6px;border-radius:3px;background:var(--bg);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rank{width:26px;flex:none;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.alivr{color:var(--accent)}
input[type="date"]{min-height:52px;-webkit-appearance:none;appearance:none}
.pill.neutral{background:var(--bg);color:var(--muted)}
.amt.plus{color:var(--accent)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-weight:400}
.catgrid button{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;font-size:15px;line-height:1.2;min-width:0}
.catgrid button .ic{width:22px;height:22px;color:var(--muted)}
.catgrid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.catgrid button.on .ic{color:var(--accent)}
.calcbox{background:var(--bg)}
.actions .row2 .btn{font-size:15px;padding:0 10px}
.calcbox input{background:var(--surface)!important}
.calcrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 40px;gap:8px;align-items:center}
.calcrow input{padding:11px 12px;font-size:16px;min-width:0}
.calcrow button{width:40px;height:44px;font-size:26px;color:var(--muted);display:grid;place-items:center}
.auth{padding-block:32px 40px}
.auth-head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.auth-head h1{margin:6px 0 0;font-size:32px}
.mark.xl{width:64px;height:64px;font-size:32px;border-radius:18px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.ok .dot{background:var(--accent)}
.status.warn{color:var(--debt)}
.status.warn .dot{background:var(--debt)}
.btn:disabled{opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
</style>
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.app{padding-top:env(safe-area-inset-top,0px)}
@media (display-mode: standalone){body{overscroll-behavior-y:none;user-select:none;-webkit-user-select:none} input,textarea,.seltext{user-select:text;-webkit-user-select:text}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark">G</span><div style="min-width:0"><div class="bname" id="bname"></div><div class="sub small" id="hsub">Gespreneur</div></div></div>
    <button class="iconbtn" onclick="settings()" aria-label="Réglages" id="gearbtn"></button>
  </header>
  <main id="view"></main>
</div>

<div class="cartbar" id="cartbar" hidden><div class="inner"></div></div>

<nav class="tabs" aria-label="Menu"><div class="inner" id="tabs"></div></nav>

<div class="scrim" id="scrim" hidden onclick="closeSheet()"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="inner"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
/* ---------- Outils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('fr-FR').replace(/[  ]/g,' ')+' F';
const num=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const uid=()=>Math.random().toString(36).slice(2,10);
const MODES=['Espèces','Wave','Orange Money'];
const KEY='gespreneur-v1';
const ic=p=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:ic('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  cart:ic('<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/>'),
  box:ic('<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>'),
  users:ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/>'),

function fdate(iso){const d=new Date(iso),t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return "Aujourd'hui";
  if(d.toDateString()===y.toDateString())return 'Hier';
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
const flong=iso=>new Date(iso).toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
const days=iso=>{const a=new Date(iso),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((b-a)/864e5)};
const since=d=>d<=0?"aujourd'hui":d===1?'depuis hier':`depuis ${d} jours`;
const isoDay=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const dayOf=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=s=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((dayOf(s)-t)/864e5)};
function livrLabel(s){if(!s)return 'Date non fixée';const k=dayDiff(s),d=dayOf(s);
  if(k<0)return `En retard · ${d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;if(k===0)return "Aujourd'hui";if(k===1)return 'Demain';
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})}
function livrQuand(s){if(!s)return 'bientôt';const k=dayDiff(s);return k===0?"aujourd'hui":k===1?'demain':'le '+dayOf(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
const livrLate=s=>!!s&&dayDiff(s)<0;
const initials=s=>String(s).replace(/\(.*?\)/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

function treso(){const t={};MODES.forEach(m=>t[m]=0);const add=(m,v)=>{t[m]=(t[m]||0)+v};
  S.ops.forEach(o=>{const sg=o.type==='vente'?1:-1;o.paiements.forEach(p=>add(p.mode,sg*p.montant))});
  (S.mvts||[]).forEach(m=>{if(m.type==='ajustement'||m.type==='apport')add(m.mode,m.montant);else if(m.type==='retrait')add(m.mode,-m.montant);else if(m.type==='transfert'){add(m.mode,-m.montant);add(m.vers,m.montant)}});
  return t}
const tresoTotal=t=>Object.values(t).reduce((a,b)=>a+b,0);

function touch(t,id){if(S.mode!=='compte')return;S.dirty[t][id]=(S.dirty[t][id]||0)+1;delete S.tomb[t][id]}
function bury(t,id){if(S.mode!=='compte')return;delete S.dirty[t][id];S.tomb[t][id]=1}

    <button class="btn small" onclick="restock('${a.id}')">Acheter</button></div>`).join('')}</div>`:''}
  <h2>Dernières opérations</h2>
  <div class="list card">${recent.map(opRow).join('')||`<p class="empty">Aucune opération pour l'instant. Touchez « Vendre » pour commencer.</p>`}</div>`;
}
function restock(id){cart={type:'achat',contactId:null,lines:{[id]:1},q:''};go('achat')}

/* ---------- Vendre / Acheter ---------- */
function vSale(){
  if(cart.type!==view)cart={type:view,contactId:null,lines:{},q:''};
  const isV=view==='vente';const c=cart.contactId&&C(cart.contactId);
  return `<h1>${isV?'Nouvelle vente':'Nouvel achat'}</h1>
  <button class="pick card" onclick="pickContact()"><span class="sub">${isV?'Client':'Fournisseur'}</span>
    <span class="title">${c?esc(c.nom):(isV?'Client de passage':'Choisir le fournisseur')}</span>${I.chev}</button>
  <div class="search">${I.search}<input id="q" type="search" placeholder="Chercher un article" value="${esc(cart.q)}" oninput="cart.q=this.value;renderGrid()" aria-label="Chercher un article"></div>
  <div id="grid" class="grid"></div>`;
}
function renderGrid(){const g=$('#grid');if(!g)return;const isV=cart.type==='vente';const q=cart.q.trim().toLowerCase();
  if(!S.articles.length){g.outerHTML=`<div id="grid" class="card pad stack"><p style="margin:0">Aucun article pour l'instant.</p><button class="btn primary" onclick="go('articles');articleForm()">${I.plus}Ajouter un article</button></div>`;return}
  const dispo=S.articles.filter(a=>isV||!isFab(a));
  if(!isV&&!dispo.length){g.outerHTML=`<div id="grid" class="card pad stack"><p style="margin:0">Aucun article à acheter pour revendre. Ce que vous fabriquez n'a pas de stock : notez vos ingrédients avec « Dépense ».</p><button class="btn primary" onclick="depSheet()">${I.wallet}Noter une dépense</button></div>`;return}
  const list=dispo.filter(a=>!q||a.nom.toLowerCase().includes(q));
  g.innerHTML=list.map(a=>{const n=cart.lines[a.id]||0;const out=isV&&!isFab(a)&&a.stock<=0;
    return `<button class="item ${n?'sel':''}" ${out?'disabled':''} onclick="addLine('${a.id}')">${thumb(a)}${n?`<span class="qty-badge">${n}</span>`:''}
    <span class="iname">${esc(a.nom)}</span><span class="amt">${fmt(prixDe(a,cart.type))}</span><span class="sub">${isFab(a)?'Fait maison':out?'Épuisé':a.stock+' en stock'}</span></button>`}).join('')
    ||`<p class="empty">Aucun article trouvé.</p>`;
  renderCartBar()}
function addLine(id){const a=A(id);const n=cart.lines[id]||0;if(cart.type==='vente'&&!isFab(a)&&n>=a.stock){toast('Plus assez de stock');return}cart.lines[id]=n+1;renderGrid()}
const cartTotal=()=>Object.entries(cart.lines).reduce((s,[id,q])=>{const a=A(id);return a?s+q*prixDe(a,cart.type):s},0);
function renderCartBar(){const b=$('#cartbar');const on=(view==='vente'||view==='achat')&&Object.keys(cart.lines).length>0;b.hidden=!on;if(!on)return;
  const n=Object.values(cart.lines).reduce((s,q)=>s+q,0);
  b.querySelector('.inner').innerHTML=`<div><div class="sub">${n} article${n>1?'s':''} · <button onclick="cart.lines={};renderGrid()" style="text-decoration:underline">Vider</button></div><div class="amt">${fmt(cartTotal())}</div></div>
  <button class="btn primary" onclick="checkout()">Continuer</button>`}

function pickContact(back){const isV=cart.type==='vente';const type=isV?'client':'fournisseur';
  const list=S.contacts.filter(c=>c.type===type).sort((a,b)=>a.nom.localeCompare(b.nom));
  openSheet(`<h3>${isV?'Choisir le client':'Choisir le fournisseur'}</h3>
  <div class="list card" style="margin-bottom:14px">${isV?`<button class="row" onclick="setContact(null,${!!back})"><span class="avatar">—</span><div class="main"><div class="title">Client de passage</div><div class="sub">Paie tout de suite</div></div></button>`:''}
  ${list.map(c=>{const b=balance(c.id);return `<button class="row" onclick="setContact('${c.id}',${!!back})">${avatar(c)}<div class="main"><div class="title">${esc(c.nom)}</div><div class="sub">${esc(c.tel)}</div></div>${b?`<span class="pill debt">Doit ${fmt(b)}</span>`:''}</button>`}).join('')}</div>
  <button class="btn" onclick="contactForm(null,'${type}','${back?'co':'pick'}')">${I.plus}Nouveau ${isV?'client':'fournisseur'}</button>`)}
function setContact(id,back){cart.contactId=id;render();if(back&&co){co.err='';sheetSet(coHtml())}else closeSheet()}

function checkout(){const d=new Date();d.setDate(d.getDate()+1);co={paye:cartTotal(),mode:'Espèces',err:'',livr:'livre',ldate:isoDay(d),lnote:''};openSheet(coHtml())}
function coRender(){const sh=$('#sheet'),st=sh.scrollTop;sheetSet(coHtml());sh.scrollTop=st}
function resteHtml(r,isV){return r>0?`Reste à payer : <span class="amt">${fmt(r)}</span><div class="sub">${isV?'Le client vous devra cette somme.':'Vous devrez cette somme au fournisseur.'}</div>`:'Tout est payé.'}
function coHtml(){const isV=cart.type==='vente';const tot=cartTotal();const r=Math.max(0,tot-co.paye);const c=cart.contactId&&C(cart.contactId);
  const lines=Object.entries(cart.lines).map(([id,q])=>{const a=A(id);const p=prixDe(a,cart.type);
    return `<div class="line"><div class="main"><div class="title">${esc(a.nom)}</div><div class="sub amt">${fmt(p)} × ${q} = ${fmt(p*q)}</div></div>
    <div class="stepper"><button aria-label="Retirer un" onclick="coQty('${id}',-1)">−</button><span class="amt">${q}</span><button aria-label="Ajouter un" onclick="coQty('${id}',1)">+</button></div></div>`}).join('');
  return `<h3>${isV?'Paiement de la vente':"Paiement de l'achat"}</h3>
  <p class="sub" style="margin:-8px 0 12px">${isV?'Client':'Fournisseur'} : <b style="color:var(--fg)">${c?esc(c.nom):(isV?'Client de passage':'aucun')}</b></p>
  <div class="lines">${lines}</div>
  <div class="total-line"><span>Total</span><span class="amt bigamt">${fmt(tot)}</span></div>
  <div class="stack">
    ${isV?`<div class="field">Livraison<div class="seg" data-name="livr"><button type="button" data-v="livre" class="${co.livr==='livre'?'on':''}" onclick="segOn(this)">Livré maintenant</button><button type="button" data-v="a_livrer" class="${co.livr==='a_livrer'?'on':''}" onclick="segOn(this)">À livrer plus tard</button></div></div>
    ${co.livr==='a_livrer'?`<label class="field" for="ldate">Date de livraison<input id="ldate" type="date" value="${co.ldate}" oninput="co.ldate=this.value"></label>
    <label class="field" for="lnote">Lieu ou note (facultatif)<input id="lnote" value="${esc(co.lnote)}" placeholder="Ex. Parcelles, unité 15" oninput="co.lnote=this.value"></label>`:''}`:''}
    <label class="field" for="paye">Montant payé maintenant<input id="paye" inputmode="numeric" value="${co.paye}" oninput="coPaye(this.value)"></label>
    <div class="chips"><button onclick="coSet(${tot})">Tout payé</button><button onclick="coSet(${Math.round(tot/2)})">La moitié</button><button onclick="coSet(0)">Rien (crédit)</button></div>
    ${co.paye>0?modeSeg('comode',co.mode):''}
    <div id="reste" class="restebox ${r?'is-debt':''}">${resteHtml(r,isV)}</div>
    ${co.err?`<p class="err">${co.err}</p>${co.needContact?`<button class="btn" onclick="pickContact(true)">${isV?'Choisir le client':'Choisir le fournisseur'}</button>`:''}`:''}
    <button class="btn primary" onclick="coSave()">Enregistrer ${isV?'la vente':"l'achat"}</button>
  </div>`}
function coPaye(v){const tot=cartTotal();co.paye=Math.min(num(v),tot);const r=tot-co.paye;const el=$('#reste');el.className='restebox '+(r?'is-debt':'');el.innerHTML=resteHtml(r,cart.type==='vente');
  if(!document.querySelector('.seg[data-name="comode"]')&&co.paye>0){el.insertAdjacentHTML('beforebegin',modeSeg('comode',co.mode))}}
function coSet(v){co.paye=v;sheetSet(coHtml())}
function coQty(id,d){const a=A(id);const old=cartTotal();const q=(cart.lines[id]||0)+d;
  if(cart.type==='vente'&&!isFab(a)&&q>a.stock){toast('Plus assez de stock');return}
  if(q<=0)delete cart.lines[id];else cart.lines[id]=q;
  if(!Object.keys(cart.lines).length){closeSheet();renderGrid();return}
  const t=cartTotal();if(co.paye===old||co.paye>t)co.paye=t;sheetSet(coHtml());renderGrid()}
function coSave(){const isV=cart.type==='vente';const tot=cartTotal();const p=Math.min(co.paye,tot);
  if(isV&&co.livr==='a_livrer'&&!cart.contactId){co.err="Une vente à livrer a besoin d'un client, pour savoir à qui livrer.";co.needContact=true;coRender();return}
  if(!isV&&!cart.contactId){co.err='Choisissez le fournisseur.';co.needContact=true;sheetSet(coHtml());return}
  if(isV&&!cart.contactId&&p<tot){co.err="Une vente à crédit a besoin d'un client, pour savoir qui doit l'argent.";co.needContact=true;sheetSet(coHtml());return}
  const now=new Date().toISOString();
  const lignes=Object.entries(cart.lines).map(([id,q])=>{const a=A(id);return{aid:id,nom:a.nom,qte:q,prix:prixDe(a,cart.type),cout:a.pa,...(isFab(a)?{fab:true}:{})}});
  const op={id:uid(),type:cart.type,contactId:cart.contactId,date:now,lignes,total:tot,paiements:p>0?[{date:now,montant:p,mode:co.mode}]:[]};
  op.paiements.forEach(x=>x.id=uid());
  if(isV&&co.livr==='a_livrer')Object.assign(op,{livraison:'a_livrer',livraison_prevue:co.ldate||null,livraison_note:(co.lnote||'').trim()||null});
  S.ops.push(op);touch('ops',op.id);op.paiements.forEach(x=>touch('paiements',x.id));commit();cart={type:null,lines:{},contactId:null,q:''};co=null;closeSheet();go('home');
  toast(isV?'Vente enregistrée':'Achat enregistré');setTimeout(()=>opSheet(op.id),300)}

/* ---------- Détail d'une opération ---------- */
function opSheet(id){const o=S.ops.find(x=>x.id===id);if(!o)return;const c=o.contactId&&C(o.contactId);const r=reste(o);const isV=o.type==='vente',isD=o.type==='depense';
  openSheet(`<h3>${TYPE_LBL[o.type]} · ${fdate(o.date)}</h3>
  <p class="sub" style="margin:-8px 0 12px">${c?`<button onclick="closeSheet();go('contact','${c.id}')" style="text-decoration:underline;color:var(--fg);font-weight:700">${esc(c.nom)}</button>`:isV?'Client de passage':isD?'Sans fournisseur':''}</p>
  ${isV&&o.livraison==='a_livrer'?`<div class="restebox ${livrLate(o.livraison_prevue)?'is-debt':''}" style="margin-bottom:10px">À livrer · ${livrLabel(o.livraison_prevue)}${o.livraison_note?`<div class="sub">${esc(o.livraison_note)}</div>`:''}</div>
    <div class="actions" style="margin:0 0 14px"><button class="btn" onclick="livrer('${o.id}',1)">Marquer comme livré</button>${c?`<button class="btn" onclick="prevenirLivr('${o.id}')">${I.msg}Prévenir le client</button>`:''}</div>`
    :isV&&o.livre_le?`<p class="sub" style="margin:-4px 0 12px">Livré le ${flong(o.livre_le)}</p>`:''}
  <div class="lines">${o.lignes.map(l=>`<div class="line"><div class="main"><div class="title">${esc(l.nom)}</div><div class="sub ${isD?'':'amt'}">${isD?esc(l.note||''):`${fmt(l.prix)} × ${l.qte}`}</div></div><span class="amt">${fmt(l.prix*l.qte)}</span></div>`).join('')}</div>
  <div class="sums"><div><span>Total</span><b class="amt">${fmt(o.total)}</b></div><div><span>Déjà payé</span><b class="amt">${fmt(paid(o))}</b></div>
  <div class="${r?'debt':''}"><span><b>Reste à payer</b></span><b class="amt">${fmt(r)}</b></div></div>
  ${o.paiements.length?`<h4>Versements</h4><div class="list card">${o.paiements.map(p=>`<button class="row" onclick="payAsk('${o.id}','${p.id}')"><div class="main"><div class="title">${fdate(p.date)}</div><div class="sub">${p.mode}</div></div><span class="amt">${fmt(p.montant)}</span></button>`).join('')}</div>
    <p class="sub small" style="margin:6px 2px 0">Touchez un versement pour le supprimer.</p><div id="paydel"></div>`:''}
  ${r?`<h4>Ajouter un versement</h4><div class="stack"><label class="field" for="oppay">${isV?'Montant reçu':'Montant payé'}<input id="oppay" inputmode="numeric" value="${r}"></label>${modeSeg('opmode')}
    <button class="btn primary" onclick="opAddPay('${o.id}')">Enregistrer le versement</button></div>`:''}
  ${isV&&c?`<div style="margin-top:12px"><button class="btn" onclick="recuSheet('${o.id}')">${I.msg}Envoyer le reçu sur WhatsApp</button></div>`:''}
  <div id="opdel" style="margin-top:24px"><button class="btn danger" onclick="opDel('${o.id}')">Supprimer ${OP_CE[o.type]}</button></div>`)}
const OP_CE={vente:'cette vente',achat:'cet achat',depense:'cette dépense'};
function opDel(id,ok){const o=S.ops.find(x=>x.id===id);if(!o)return;
  if(!ok){$('#opdel').innerHTML=`<p style="margin:0 0 10px"><b>Supprimer ${OP_CE[o.type]} ?</b> ${o.paiements.length?'Ses versements seront aussi supprimés. ':''}${o.type==='depense'?'Les dettes':'Le stock, les dettes'} et l'argent disponible seront recalculés.</p>
    <div class="row2"><button class="btn" onclick="opSheet('${id}')">Annuler</button><button class="btn danger" onclick="opDel('${id}',1)">Oui, supprimer</button></div>`;$('#opdel').scrollIntoView({block:'nearest'});return}
  S.ops=S.ops.filter(x=>x.id!==id);o.paiements.forEach(p=>bury('paiements',p.id));bury('ops',id);commit();closeSheet();render();toast('Supprimé')}
function payAsk(oid,pid){const o=S.ops.find(x=>x.id===oid),p=o&&o.paiements.find(x=>x.id===pid);if(!p)return;
  $('#paydel').innerHTML=`<div class="card pad stack" style="margin-top:10px"><p style="margin:0"><b>Supprimer le versement de ${fmt(p.montant)} (${p.mode}, ${fdate(p.date).toLowerCase()}) ?</b></p>
    <div class="row2"><button class="btn" onclick="$('#paydel').innerHTML=''">Annuler</button><button class="btn danger" onclick="payDel('${oid}','${pid}')">Oui, supprimer</button></div></div>`;$('#paydel').scrollIntoView({block:'nearest'})}
function payDel(oid,pid){const o=S.ops.find(x=>x.id===oid);o.paiements=o.paiements.filter(x=>x.id!==pid);bury('paiements',pid);commit();render();opSheet(oid);toast('Versement supprimé')}
function livrer(id,fromSheet){const o=S.ops.find(x=>x.id===id);if(!o)return;o.livraison='livre';o.livre_le=new Date().toISOString();touch('ops',id);commit();render();
  if(fromSheet)opSheet(id);toast('Marqué comme livré')}
function prevenirLivr(id){const o=S.ops.find(x=>x.id===id),c=C(o.contactId),r=reste(o);
  const msg=`Bonjour ${c.nom.split(' ')[0]},\nC'est ${S.boutique}. Votre commande (${o.lignes.map(l=>`${l.qte} × ${l.nom}`).join(', ')}) sera livrée ${livrQuand(o.livraison_prevue)}${o.livraison_note?` (${o.livraison_note})`:''}.${r?`\nReste à payer à la livraison : ${fmt(r).replace(/ F$/,' FCFA')}.`:''}\nMerci !`;
  waSheet('Prévenir '+esc(c.nom),c.tel,msg)}
function opAddPay(id){const o=S.ops.find(x=>x.id===id);const m=Math.min(num($('#oppay').value),reste(o));if(!m){toast('Indiquez un montant');return}
  const pay={id:uid(),date:new Date().toISOString(),montant:m,mode:segVal('opmode')||'Espèces'};o.paiements.push(pay);touch('paiements',pay.id);commit();render();opSheet(id);toast('Versement enregistré')}

/* ---------- Contacts ---------- */
function vContacts(){const all=S.contacts.filter(c=>c.type===ctab);const tot=all.reduce((s,c)=>s+balance(c.id),0);
  return `<div class="titlebar"><h1>Contacts</h1><button class="btn small" onclick="contactForm(null,ctab,'detail')">${I.plus}Ajouter</button></div>
  <div class="seg" style="margin-bottom:14px"><button class="${ctab==='client'?'on':''}" onclick="ctab='client';render()">Clients</button><button class="${ctab==='fournisseur'?'on':''}" onclick="ctab='fournisseur';render()">Fournisseurs</button></div>
  <div class="card pad" style="margin-bottom:14px"><div class="sub">${ctab==='client'?'Total que les clients vous doivent':'Total que vous devez aux fournisseurs'}</div><div class="amt kpi ${tot&&ctab==='client'?'debt':''}">${fmt(tot)}</div></div>
  <div class="search">${I.search}<input type="search" placeholder="Chercher un nom" value="${esc(cq)}" oninput="cq=this.value;renderContactList()" aria-label="Chercher un nom"></div>
  <div id="clist" class="list card"></div>`}
function renderContactList(){const el=$('#clist');if(!el)return;const q=cq.trim().toLowerCase();
  const list=S.contacts.filter(c=>c.type===ctab&&(!q||c.nom.toLowerCase().includes(q))).sort((a,b)=>balance(b.id)-balance(a.id)||a.nom.localeCompare(b.nom));
  el.innerHTML=list.map(c=>{const b=balance(c.id);return `<button class="row" onclick="go('contact','${c.id}')">${avatar(c)}<div class="main"><div class="title">${esc(c.nom)}</div><div class="sub">${esc(c.tel)}</div></div>
    ${b?`<span class="pill debt">${ctab==='client'?'Doit':'À payer'} ${fmt(b)}</span>`:'<span class="pill">À jour</span>'}</button>`}).join('')||`<p class="empty">${q?'Personne trouvé.':`Aucun ${ctab} pour l'instant.`}</p>`}

function vContact(){const c=C(param);if(!c){view='contacts';return vContacts()}const isC=c.type==='client';const b=balance(c.id);const od=oldestDue(c.id);const ops=opsOf(c.id);
  return `<button class="back" onclick="ctab='${c.type}';go('contacts')">${I.back}${isC?'Clients':'Fournisseurs'}</button>
  <div class="head">${avatar(c,'lg')}<div class="main" style="min-width:0"><h1>${esc(c.nom)}</h1><div class="sub">${isC?'Client':'Fournisseur'} · <span class="seltext">${esc(c.tel)}</span></div></div></div>
  <div class="card balance ${b?'is-debt':''}"><div class="sub">${b?(isC?'Ce client vous doit':'Vous devez à ce fournisseur'):'Aucune dette'}</div>
    <div class="amt bigamt">${fmt(b)}</div>${od?`<div class="sub">Depuis le ${flong(od.date)}, ${since(days(od.date))}</div>`:''}${c.relance?`<div class="sub">Dernière relance : ${fdate(c.relance).toLowerCase()}</div>`:''}</div>
  <div class="actions">
    ${b?`<button class="btn primary" onclick="paySheet('${c.id}')">${isC?'Encaisser un paiement':'Payer le fournisseur'}</button>`:''}
    ${b&&isC?`<button class="btn" onclick="relanceSheet('${c.id}')">${I.msg}Relancer sur WhatsApp</button>`:''}
    <div class="row2"><button class="btn" onclick="startWith('${c.id}')">${isC?'Nouvelle vente':'Nouvel achat'}</button><button class="btn" onclick="contactForm('${c.id}','${c.type}','detail')">Modifier</button></div>
  </div>
  <h2>Historique</h2><div class="list card">${ops.map(opRow).join('')||'<p class="empty">Aucune opération avec ce contact.</p>'}</div>`}
function startWith(cid){const c=C(cid);const t=c.type==='client'?'vente':'achat';cart={type:t,contactId:cid,lines:{},q:''};go(t)}

function contactForm(id,type,ret){const c=id?C(id):{nom:'',tel:'+221 '};const isC=type==='client';const canDel=id&&!opsOf(id).length;
  openSheet(`<h3>${id?'Modifier':(isC?'Nouveau client':'Nouveau fournisseur')}</h3><div class="stack">
  <label class="field" for="cnom">Nom<input id="cnom" value="${esc(c.nom)}" placeholder="${isC?'Ex. Aminata Ba':'Ex. Grossiste Médina'}" autocomplete="off"></label>
  <label class="field" for="ctel">Numéro WhatsApp<input id="ctel" inputmode="tel" value="${esc(c.tel)}"></label>
  <p id="cerr" class="err" hidden></p>
  <button class="btn primary" onclick="saveContact('${id||''}','${type}','${ret}')">Enregistrer</button>
  ${canDel?`<button class="btn danger" onclick="delContact('${id}')">Supprimer ce contact</button>`:''}</div>`);
  setTimeout(()=>{if(!id)$('#cnom')?.focus()},250)}
function saveContact(id,type,ret){const nom=$('#cnom').value.trim(),tel=$('#ctel').value.trim();
  if(!nom){const e=$('#cerr');e.textContent='Écrivez le nom.';e.hidden=false;return}
  let c;if(id){c=C(id);c.nom=nom;c.tel=tel}else{c={id:uid(),type,nom,tel,relance:null};S.contacts.push(c)}touch('contacts',c.id);commit();
  if(ret==='co'){cart.contactId=c.id;co.err='';render();sheetSet(coHtml());return}
  if(ret==='dep'&&dep){dep.contactId=c.id;dep.err='';sheetSet(depHtml());return}
  if(ret==='pick'){cart.contactId=c.id;closeSheet();render();return}
  closeSheet();ctab=type;go('contact',c.id);toast('Contact enregistré')}
function delContact(id){S.contacts=S.contacts.filter(c=>c.id!==id);bury('contacts',id);commit();closeSheet();go('contacts');toast('Contact supprimé')}

function paySheet(cid){const c=C(cid);const b=balance(cid);const isC=c.type==='client';
  openSheet(`<h3>${isC?'Encaisser un paiement':'Payer le fournisseur'}</h3>
  <p class="sub" style="margin:-8px 0 14px">${esc(c.nom)} · ${isC?'doit':'à payer'} <b class="debt amt">${fmt(b)}</b></p>
  <div class="stack"><label class="field" for="pmt">Montant ${isC?'reçu':'payé'}<input id="pmt" inputmode="numeric" value="${b}"></label>
  ${modeSeg('pmode')}<p class="sub" style="margin:0">Le paiement règle d'abord les plus anciennes dettes.</p>
  <button class="btn primary" onclick="savePay('${cid}')">Enregistrer</button></div>`)}

/* ---------- Rapports ---------- */
let rper='mois', roff=0;
const PERIODES=[['jour','Jour'],['mois','Mois'],['annee','Année'],['tout','Depuis le début']];
const finJour=d=>{const x=new Date(d);x.setHours(23,59,59,999);return x};
function debutActivite(){let m=Date.now();S.ops.forEach(o=>{const t=Date.parse(o.date);if(t<m)m=t});(S.mvts||[]).forEach(x=>{const t=Date.parse(x.date);if(t<m)m=t});
  const d=new Date(m);d.setHours(0,0,0,0);return d}
function periode(k,off=0){const n=new Date();
  if(k==='jour'){const s=new Date(n);s.setHours(0,0,0,0);s.setDate(s.getDate()+off);return [s,finJour(s)]}
  if(k==='mois')return [new Date(n.getFullYear(),n.getMonth()+off,1),new Date(n.getFullYear(),n.getMonth()+off+1,0,23,59,59,999)];
  if(k==='annee')return [new Date(n.getFullYear()+off,0,1),new Date(n.getFullYear()+off,11,31,23,59,59,999)];
  return [debutActivite(),finJour(n)]}
// Période de comparaison : la veille, le mois d'avant, l'année d'avant (à date égale pour la période en cours)
function avant(k,[s,e],off=0){
  if(k==='jour'){const p=new Date(s);p.setDate(p.getDate()-1);return [p,finJour(p)]}
  if(k==='mois'){const p=new Date(s.getFullYear(),s.getMonth()-1,1),last=new Date(p.getFullYear(),p.getMonth()+1,0).getDate();
    return [p,new Date(p.getFullYear(),p.getMonth(),off===0?Math.min(new Date().getDate(),last):last,23,59,59,999)]}
  if(k==='annee'){const p=new Date(s.getFullYear()-1,0,1),n=new Date();
    return [p,off===0?new Date(p.getFullYear(),n.getMonth(),n.getDate(),23,59,59,999):new Date(p.getFullYear(),11,31,23,59,59,999)]}
  return null}
function titrePeriode(k,[s,e],off){
  if(k==='jour')return off===0?"Aujourd'hui":off===-1?'Hier':s.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(k==='mois'){const t=s.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)}
  if(k==='annee')return String(s.getFullYear());
  return 'Depuis le '+s.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}
function setPer(k){rper=k;roff=0;render()}
function navPer(d){roff=Math.min(0,roff+d);render()}
const coutDe=l=>{if(l.fab)return 0;const a=A(l.aid);if(isFab(a))return 0;return l.cout!=null?l.cout:((a||{}).pa||0)};
function chiffres([s,e]){const inP=d=>{const t=new Date(d);return t>=s&&t<=e};
  const ventes=S.ops.filter(o=>o.type==='vente'&&inP(o.date)),achats=S.ops.filter(o=>o.type==='achat'&&inP(o.date));
  const recu=[];S.ops.filter(o=>o.type==='vente').forEach(o=>o.paiements.forEach(p=>{if(inP(p.date))recu.push(p)}));
  const depenses=S.ops.filter(o=>o.type==='depense'&&inP(o.date));
  const R={ventes,achats,recu,depenses,
    totalV:ventes.reduce((t,o)=>t+o.total,0),
    totalA:achats.reduce((t,o)=>t+o.total,0),
    totalR:recu.reduce((t,p)=>t+p.montant,0),
    credit:ventes.reduce((t,o)=>t+reste(o),0),
    coutRev:ventes.reduce((t,o)=>t+o.lignes.reduce((u,l)=>u+coutDe(l)*l.qte,0),0),
    totalD:depenses.reduce((t,o)=>t+o.total,0),
    retraits:(S.mvts||[]).filter(m=>m.type==='retrait'&&inP(m.date)).reduce((t,m)=>t+m.montant,0)};
  R.benef=R.totalV-R.coutRev-R.totalD;return R}
const COMP={jour:'à la veille',mois:"au mois d'avant",annee:"à l'année d'avant"};
function evolution(now,before,k){if(before==null)return '';if(!before)return now?'<span class="pill">Nouveau</span>':'';const p=Math.round((now-before)/before*100);
  return `<span class="pill ${p<0?'down':''}">${p>=0?'▲':'▼'} ${Math.abs(p)} %</span> <span class="sub">par rapport ${COMP[k]}</span>`}
function vRapports(){const P=periode(rper,roff),[s,e]=P,R=chiffres(P),AV=avant(rper,P,roff),B=AV?chiffres(AV):null;
  const titre=titrePeriode(rper,P,roff),debut=debutActivite(),auBout=s<=debut;
  // Graphique : par jour (mois), par mois (année, depuis le début)
  let chart='';
  if(rper!=='jour'){const fin=new Date(Math.min(e,finJour(new Date())));const B2=[];
    if(rper==='mois'){for(let d=new Date(s);d<=fin;d.setDate(d.getDate()+1)){const a=new Date(d);B2.push({s:a,e:finJour(a),court:String(a.getDate()),long:a.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})})}}

    ${R.coutRev?`<div><span>− Coût des articles revendus</span><b class="amt">${fmt(R.coutRev)}</b></div>`:''}
    <div><span>− Dépenses</span><b class="amt">${fmt(R.totalD)}</b></div>
    <div class="${R.benef<0?'debt':''}"><span><b>Bénéfice net</b></span><b class="amt">${R.benef<0?'− ':''}${fmt(Math.abs(R.benef))}</b></div></div>
    <p class="sub small" style="margin:12px 0 0">Les marchandises achetées comptent seulement quand elles sont vendues. Ce que vous fabriquez est compté par vos dépenses (ingrédients, gaz…).</p></div>
  <div class="kgrid">

function resetData(k,ok){if(!ok){$('#datazone').innerHTML=`<p style="margin:0"><b>Effacer tous les clients, articles, opérations et mouvements d'argent, sur ce téléphone et en ligne ?</b></p>
  <div class="row2"><button class="btn" onclick="settings()">Annuler</button><button class="btn danger" onclick="resetData('${k}',1)">Oui, tout effacer</button></div>`;return}

let installEvt=null;

const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);

/* ---------- Sauvegarde ---------- */
function exportData(){
  const d=new Date().toISOString().slice(0,10);
  const {boutique,auto,activite,articles,contacts,ops,mvts}=S;
  const blob=new Blob([JSON.stringify({app:'gespreneur',version:3,date:new Date().toISOString(),data:{boutique,auto,activite,articles,contacts,ops,mvts}})],{type:'application/json'});
  const name=`gespreneur-${S.boutique.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'boutique'}-${d}.json`;
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Sauvegarde Gespreneur'}).then(()=>toast('Sauvegarde partagée')).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Sauvegarde téléchargée')}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const err=$('#imperr');try{const j=JSON.parse(r.result);const d=j.data||j;
      if(!Array.isArray(d.articles)||!Array.isArray(d.contacts)||!Array.isArray(d.ops))throw 0;
      normalizeData(d);
      if(S.mode==='compte'){buryAll();S.articles=d.articles;S.contacts=d.contacts;S.ops=d.ops;S.mvts=d.mvts;S.boutique=d.boutique||S.boutique;S.activite=d.activite||S.activite;S.dirtyProfil=true;touchAll()}
      else S={mode:'demo',boutique:d.boutique||'Ma boutique',activite:d.activite||'deux',auto:d.auto||{on:false,jours:7},articles:d.articles,contacts:d.contacts,ops:d.ops,mvts:d.mvts};
      cart={type:null,lines:{},contactId:null,q:''};commit();closeSheet();go('home');toast('Données restaurées')}
    catch(e){err.textContent="Ce fichier n'est pas une sauvegarde Gespreneur.";err.hidden=false}};
  r.readAsText(f)}

/* ---------- Compte ---------- */
let sb=null, authTab='login', legacy=null;
const LEGACY_KEY='gespreneur-ancien';
function initSb(){const c=window.GESPRENEUR_CONFIG;if(!window.supabase||!c||!c.url||/VOTRE/.test(c.url))return null;
  try{return supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gespreneur-auth'}})}catch(e){return null}}
const telEmail=t=>waNum(t)+'@tel.gespreneur.app';
function fmtTel(t){const d=waNum(t);return d.startsWith('221')&&d.length===12?`+221 ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}`:(d?'+'+d:'')}
function normalizeData(d){d.articles=d.articles||[];d.contacts=d.contacts||[];d.ops=d.ops||[];d.mvts=d.mvts||[];
  d.ops.forEach(o=>{o.paiements=(o.paiements||[]).map(p=>({...p,id:p.id||uid()}))});
  d.articles.forEach(a=>{if(a.base==null){const m=d.ops.reduce((s,o)=>s+o.lignes.reduce((t,l)=>l.aid===a.id?t+(o.type==='achat'?l.qte:-l.qte):t,0),0);a.base=(a.stock||0)-m}});return d}
function touchAll(){S.articles.forEach(x=>touch('articles',x.id));S.contacts.forEach(x=>touch('contacts',x.id));(S.mvts||[]).forEach(x=>touch('mvts',x.id));S.ops.forEach(o=>{touch('ops',o.id);o.paiements.forEach(p=>touch('paiements',p.id))})}

function vAuth(){

  const up=authTab==='signup';

  <div class="seg" style="margin-bottom:18px"><button class="${up?'':'on'}" onclick="authTab='login';render()">Se connecter</button><button class="${up?'on':''}" onclick="authTab='signup';render()">Créer un compte</button></div>
  <form class="stack" onsubmit="event.preventDefault();doAuth()">

    ${up?`<label class="field" for="apin2">Retapez le code<input id="apin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
    <div class="field">Votre activité${actSeg(null)}</div>`:''}
    <p id="aerr" class="err" hidden></p>
    <button id="abtn" class="btn primary" type="submit">${up?'Créer mon compte':'Se connecter'}</button>
  </form>
  ${legacy?`<p class="note">Les données déjà présentes sur ce téléphone seront ajoutées à votre compte.</p>`:''}
  <button class="btn" style="margin-top:12px;border-color:transparent;background:transparent" onclick="startDemo()">Voir une démonstration</button></div>`}
async function doAuth(){const up=authTab==='signup';const err=$('#aerr'),btn=$('#abtn');
  const show=m=>{err.textContent=m;err.hidden=false;btn.disabled=false;btn.textContent=up?'Créer mon compte':'Se connecter'};
  const d=waNum($('#atel').value),pin=$('#apin').value.trim();
  if(d.length<11)return show('Écrivez votre numéro de téléphone.');
  if(!/^\d{6}$/.test(pin))return show('Le code doit avoir 6 chiffres.');
  if(up&&pin!==$('#apin2').value.trim())return show('Les deux codes ne sont pas pareils.');
  if(up&&!$('#about').value.trim())return show('Écrivez le nom de votre boutique.');
  const act=up?segVal('activite'):null;if(up&&!act)return show('Choisissez votre activité : je revends, je fabrique, ou les deux.');
  if(!navigator.onLine)return show('Pas de connexion internet. Réessayez quand le réseau revient.');
  err.hidden=true;btn.disabled=true;btn.textContent='Un instant…';
  try{const r=up?await sb.auth.signUp({email:telEmail(d),password:pin,options:{data:{telephone:'+'+d}}})
                :await sb.auth.signInWithPassword({email:telEmail(d),password:pin});
    if(r.error)throw r.error;
    if(!r.data.session)return show("Compte créé, mais la connexion est bloquée : dans Supabase, désactivez « Confirm email ».");
    startAccount(r.data.session.user,up?$('#about').value.trim():null,'+'+d,act);
  }catch(e){const m=String(e.message||e);
    show(/invalid login/i.test(m)?'Numéro ou code incorrect.':/already|exists/i.test(m)?'Ce numéro a déjà un compte. Touchez « Se connecter ».'
      :/fetch|network/i.test(m)?'Pas de connexion au serveur. Vérifiez internet.':/rate|too many/i.test(m)?"Trop d'essais. Attendez quelques minutes.":'Erreur : '+m)}}
function startAccount(u,boutique,tel,act){
  S=emptyAccount(u,boutique);S.user.tel=tel||S.user.tel;if(act)S.activite=act;if(boutique)S.dirtyProfil=true;
  if(legacy){normalizeData(legacy);S.articles=legacy.articles;S.contacts=legacy.contacts;S.ops=legacy.ops;S.mvts=legacy.mvts;touchAll();legacy=null;try{localStorage.removeItem(LEGACY_KEY)}catch(e){}}
  view='home';commit();render();window.scrollTo(0,0);toast(boutique?'Compte créé':'Connecté');sync()}
function startDemo(){S=seed();recomputeStock();view='home';save();render()}
function exitDemo(tab){S=null;authTab=tab==='login'?'login':'signup';save();closeSheet();render();window.scrollTo(0,0)}
async function logout(step){const z=$('#logoutzone');const n=pending();
  if(!step){z.innerHTML=`<p style="margin:0"><b>${n?`${n} modification${n>1?'s':''} pas encore envoyée${n>1?'s':''}. Elles seront envoyées avant la déconnexion.`:'Se déconnecter de ce téléphone ?'}</b></p>
    <div class="row2"><button class="btn" onclick="settings()">Annuler</button><button class="btn danger" onclick="logout(1)">Se déconnecter</button></div>`;return}
  if(step===1&&n){await sync();if(pending()){z.innerHTML=`<p class="err" style="margin:0">Impossible d'envoyer ${pending()} modification(s) (pas d'internet ?). En vous déconnectant maintenant, elles seront perdues.</p>
    <div class="row2"><button class="btn" onclick="settings()">Annuler</button><button class="btn danger" onclick="logout(2)">Perdre et quitter</button></div>`;return}}
  try{await sb.auth.signOut()}catch(e){}
  S=null;authTab='login';save();closeSheet();render();window.scrollTo(0,0)}
function reloginSheet(){openSheet(`<h3>Reconnexion</h3><p class="sub" style="margin:-8px 0 14px">${esc(fmtTel(S.user.tel))}</p>
  <form class="stack" onsubmit="event.preventDefault();relogin()"><label class="field" for="rpin">Code secret<input id="rpin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></label>
  <p id="rerr" class="err" hidden></p><button class="btn primary" type="submit">Se reconnecter</button></form>`)}
async function relogin(){const e=$('#rerr');
  try{const r=await sb.auth.signInWithPassword({email:telEmail(S.user.tel),password:$('#rpin').value.trim()});if(r.error)throw r.error;
    if(r.data.user.id!==S.user.id)throw new Error('autre compte');closeSheet();syncErr='';toast('Reconnecté');sync()}
  catch(x){e.textContent=/invalid/i.test(x.message)?'Code incorrect.':'Reconnexion impossible : '+x.message;e.hidden=false}}

/* ---------- Synchronisation ---------- */
// Chaque modification est gardée dans une file d'attente sur le téléphone, puis envoyée dès qu'il y a internet.
let syncing=false, syncAgain=false, syncTimer=null, lastSync=null, syncErr='';
const T={articles:'articles',contacts:'contacts',ops:'operations',paiements:'paiements',mvts:'mouvements'};
function findPay(id){for(const o of S.ops)for(const p of o.paiements)if(p.id===id)return [o,p];return null}
function toRow(t,id){const owner=S.user.id;
  if(t==='articles'){const a=A(id);return a&&{owner,id,nom:a.nom,pv:a.pv,pa:a.pa,base:a.base||0,seuil:a.seuil,photo:a.photo,genre:a.genre||'revente',recette:a.recette||null,portions:a.portions||null,deleted:false}}
  if(t==='mvts'){const m=(S.mvts||[]).find(x=>x.id===id);return m&&{owner,id,date:m.date,type:m.type,montant:m.montant,mode:m.mode,vers:m.vers||null,note:m.note||null,deleted:false}}
  if(t==='contacts'){const c=C(id);return c&&{owner,id,type:c.type,nom:c.nom,tel:c.tel,relance:c.relance,deleted:false}}
  if(t==='ops'){const o=S.ops.find(x=>x.id===id);return o&&{owner,id,type:o.type,contact_id:o.contactId,date:o.date,lignes:o.lignes,total:o.total,
    livraison:o.livraison||null,livraison_prevue:o.livraison_prevue||null,livraison_note:o.livraison_note||null,livre_le:o.livre_le||null,deleted:false}}
  const f=findPay(id);return f&&{owner,id,op_id:f[0].id,date:f[1].date,montant:f[1].montant,mode:f[1].mode,deleted:false}}
function applyRow(t,r){
  if(t==='mvts')S.mvts=S.mvts||[];
  const list=t==='articles'?S.articles:t==='contacts'?S.contacts:t==='ops'?S.ops:t==='mvts'?S.mvts:null;
  if(list){const i=list.findIndex(x=>x.id===r.id);if(r.deleted){if(i>=0)list.splice(i,1);return}
    const x=t==='articles'?{id:r.id,nom:r.nom||'',pv:+r.pv||0,pa:+r.pa||0,base:+r.base||0,seuil:+r.seuil||0,photo:r.photo||null,stock:0,genre:r.genre||'revente',recette:r.recette||null,portions:r.portions||null}
      :t==='mvts'?{id:r.id,date:r.date,type:r.type,montant:+r.montant||0,mode:r.mode,vers:r.vers||null,note:r.note||null}
      :t==='contacts'?{id:r.id,type:r.type,nom:r.nom||'',tel:r.tel||'',relance:r.relance||null}
      :{id:r.id,type:r.type,contactId:r.contact_id||null,date:r.date,lignes:r.lignes||[],total:+r.total||0,paiements:i>=0?list[i].paiements:[],
        ...(r.livraison?{livraison:r.livraison,livraison_prevue:r.livraison_prevue||null,livraison_note:r.livraison_note||null,livre_le:r.livre_le||null}:{})};
    if(i>=0)list[i]=x;else list.push(x);return}
  S.ops.forEach(o=>{const j=o.paiements.findIndex(p=>p.id===r.id);if(j>=0)o.paiements.splice(j,1)});
  if(r.deleted)return;const o=S.ops.find(x=>x.id===r.op_id);
  if(o){o.paiements.push({id:r.id,date:r.date,montant:+r.montant||0,mode:r.mode});o.paiements.sort((a,b)=>a.date.localeCompare(b.date))}}
async function push(){const owner=S.user.id;
  if(S.dirtyProfil){S.dirtyProfil=false;const r=await sb.from('profils').upsert({owner,telephone:S.user.tel,boutique:S.boutique,activite:S.activite||null,auto_on:S.auto.on,auto_jours:S.auto.jours});if(r.error){S.dirtyProfil=true;throw r.error}}
  for(const t of TABLES){
    const snap={...S.dirty[t]},ids=Object.keys(snap),rows=ids.map(id=>toRow(t,id)).filter(Boolean);
    for(let i=0;i<rows.length;i+=200){const r=await sb.from(T[t]).upsert(rows.slice(i,i+200),{onConflict:'owner,id'});if(r.error)throw r.error}
    ids.forEach(id=>{if(S.dirty[t][id]===snap[id])delete S.dirty[t][id]});
    const tombs=Object.keys(S.tomb[t]);
    if(tombs.length){const r=await sb.from(T[t]).upsert(tombs.map(id=>({owner,id,deleted:true})),{onConflict:'owner,id'});if(r.error)throw r.error;tombs.forEach(id=>delete S.tomb[t][id])}
    save()}}
async function pull(){
  const since=S.lastPull?new Date(new Date(S.lastPull).getTime()-120000).toISOString():'1970-01-01T00:00:00Z';
  const get=async tb=>{let all=[];for(let from=0;;from+=1000){const r=await sb.from(tb).select('*').gt('updated_at',since).order('updated_at').range(from,from+999);
    if(r.error)throw r.error;all=all.concat(r.data);if(r.data.length<1000)return all}};
  const data={};for(const t of TABLES)data[t]=await get(T[t]);
  const pr=await sb.from('profils').select('*').maybeSingle();if(pr.error)throw pr.error;
  let changed=false,max=S.lastPull;
  if(pr.data&&!S.dirtyProfil){if(pr.data.boutique&&pr.data.boutique!==S.boutique){S.boutique=pr.data.boutique;changed=true}S.auto={on:!!pr.data.auto_on,jours:pr.data.auto_jours||7};if(pr.data.activite&&pr.data.activite!==S.activite){S.activite=pr.data.activite;changed=true}}
  for(const t of TABLES)for(const r of data[t]){if(!max||new Date(r.updated_at)>new Date(max))max=r.updated_at;
    if(S.dirty[t][r.id]||S.tomb[t][r.id])continue;applyRow(t,r);changed=true}
  S.lastPull=max;return changed}
async function sync(){
  if(!S||S.mode!=='compte'||!sb)return;
  if(!navigator.onLine){renderStatus();return}
  if(syncing){syncAgain=true;return}
  syncing=true;renderStatus();
  try{const {data}=await sb.auth.getSession();
    if(!data.session||data.session.user.id!==S.user.id){syncErr='session';return}
    await push();const changed=await pull();lastSync=new Date();syncErr='';recomputeStock();save();
    const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#view input');
    if(changed&&$('#sheet').hidden&&!typing)render();
  }catch(e){const m=String(e.message||e);syncErr=/column|schema cache|check constraint|does not exist|violates check/i.test(m)?'schema':m;console.warn('Synchronisation :',e)}
  finally{syncing=false;renderStatus();if(syncAgain){syncAgain=false;setTimeout(sync,400)}}}
function scheduleSync(){if(!S||S.mode!=='compte')return;renderStatus();clearTimeout(syncTimer);syncTimer=setTimeout(sync,1500)}
async function syncNow(){if(!navigator.onLine){toast('Pas de connexion internet');return}await sync();toast(syncErr?'Synchronisation impossible':'Données à jour');if(!$('#sheet').hidden)settings()}
function statusInfo(){if(!S)return ['',''];if(S.mode==='demo')return ['','Démonstration'];const n=pending();
  if(!sb)return ['warn','Serveur non configuré'];
  if(!navigator.onLine)return ['warn',n?`Hors ligne · ${n} en attente`:'Hors ligne'];
  if(syncing)return ['','Synchronisation…'];
  if(syncErr==='session')return ['warn','Reconnexion nécessaire'];
  if(syncErr==='schema')return ['warn',n?`Base à mettre à jour · ${n} en attente`:'Base à mettre à jour'];
  if(syncErr)return ['warn',n?`Erreur · ${n} en attente`:'Erreur de synchronisation'];
  if(n)return ['',`${n} en attente`];
  return ['ok',lastSync?'Synchronisé':'Connecté']}
const statusText=()=>statusInfo()[1];
function renderStatus(){const el=$('#hsub');if(!el||!S)return;const [c,t]=statusInfo();
  el.innerHTML=S.mode==='demo'?t:`<button class="status ${c}" onclick="${syncErr==='session'?'reloginSheet()':'syncNow()'}"><span class="dot"></span>${t}</button>`}
window.addEventListener('online',()=>sync());
window.addEventListener('offline',renderStatus);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
setInterval(()=>sync(),60000);

/* ---------- Démarrage ---------- */
async function boot(){
  $('#gearbtn').innerHTML=I.gear;
  sb=initSb();
  let st=load();
  // Données d'une version sans compte : gardées pour être ajoutées au compte
  if(st&&!st.mode){if(!st.exemple&&((st.articles||[]).length||(st.contacts||[]).length||(st.ops||[]).length)){try{localStorage.setItem(LEGACY_KEY,JSON.stringify(st))}catch(e){}}st=null}
  try{legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null')}catch(e){}
  S=st;
  if(S){if(!S.dirty&&S.mode==='compte'){S.dirty=blank();S.tomb=blank()}S.mvts=S.mvts||[];if(S.dirty){S.dirty.mvts=S.dirty.mvts||{};S.tomb.mvts=S.tomb.mvts||{}}recomputeStock()}
  {const h=location.hash.slice(1);if(S&&(h==='vente'||h==='achat'))view=h;if(h)history.replaceState(null,'',location.pathname)}
  render();
  if(S&&S.mode==='compte')sync();
}
boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
